<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Osakidetza OPE 23-24-25</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="top-bar">
      <div>
        <h1>Osakidetza OPE 23-24-25</h1>
        <p class="subtitle">App Preguntas TSID y RT</p>
      </div>
      <p id="dataStatus" class="status-pill">Cargando preguntas...</p>
    </header>

    <main class="app-shell">
      <section id="setupView" class="view">
        <div class="setup-grid">
          <section class="panel">
            <div class="section-heading">
              <p class="eyebrow">Paso 1</p>
              <h2>Elige el tipo de examen</h2>
            </div>
            <div id="examTypeGrid" class="exam-type-grid" aria-label="Tipo de examen"></div>
          </section>

          <section class="panel">
            <div class="section-heading">
              <p class="eyebrow">Paso 2</p>
              <h2>Prepara un test de 100 preguntas</h2>
            </div>

            <div class="segmented-control" role="tablist" aria-label="Modo de selección de preguntas">
              <button id="randomModeButton" class="segment is-active" type="button" aria-selected="true">Aleatorio</button>
              <button id="blockModeButton" class="segment" type="button" aria-selected="false">Bloque</button>
            </div>

            <label id="blockSelectRow" class="select-row is-hidden" for="blockSelect">
              <span>Bloque</span>
              <select id="blockSelect"></select>
            </label>

            <p id="buildHint" class="build-hint"></p>
            <button id="startButton" class="primary-button" type="button" disabled>Empezar test</button>
          </section>
        </div>
      </section>

      <section id="examView" class="view is-hidden">
        <div class="exam-toolbar">
          <div>
            <button id="backButton" class="ghost-button" type="button">Cambiar configuración</button>
            <h2 id="examTitle"></h2>
            <p id="examMeta" class="muted-text"></p>
          </div>

          <div class="progress-card" aria-live="polite">
            <span id="answeredCount">0 / 100 respondidas</span>
            <div class="progress-track" aria-hidden="true">
              <span id="progressBar"></span>
            </div>
          </div>
        </div>

        <section id="examProgressDock" class="progress-dock" aria-label="Progreso y preguntas pendientes">
          <div class="progress-dock-main">
            <button
              id="pendingToggleButton"
              class="dock-toggle"
              type="button"
              aria-expanded="false"
              aria-controls="pendingPanel"
            >
              <span id="pendingToggleIcon" class="dock-toggle-icon" aria-hidden="true">&lt;</span>
              <span>Pendientes</span>
            </button>

            <div class="dock-progress" aria-live="polite">
              <span id="compactAnsweredCount">0 / 100 respondidas</span>
              <div class="mini-progress-track" aria-hidden="true">
                <span id="compactProgressBar"></span>
              </div>
            </div>

            <button id="nextUnansweredButton" class="secondary-button compact-button" type="button">
              Siguiente sin responder
            </button>
          </div>

          <div id="pendingPanel" class="pending-panel" hidden>
            <div class="pending-panel-header">
              <strong id="pendingSummary">100 pendientes</strong>
            </div>
            <div id="pendingQuestionGrid" class="pending-question-grid" aria-label="Preguntas sin responder"></div>
          </div>
        </section>

        <section id="scorePanel" class="score-panel is-hidden" aria-live="polite"></section>

        <form id="questionsForm" class="questions-list"></form>

        <div class="action-bar">
          <button id="submitButton" class="primary-button" type="button" disabled>Corregir test</button>
          <button id="newTestButton" class="secondary-button is-hidden" type="button">Nuevo test</button>
        </div>
      </section>
    </main>
  </body>
</html>
